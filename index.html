<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BOX CAMERA SCANNER</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      margin: 0;
      padding: 15px;
    }

    .box {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 18px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,.15);
    }

    h2 {
      text-align: center;
      margin-top: 5px;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      margin: 8px 0 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 17px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 10px;
      border: 0;
      border-radius: 9px;
      font-size: 18px;
      font-weight: bold;
    }

    .start {
      background: #198754;
      color: white;
    }

    .stop {
      background: #dc3545;
      color: white;
    }

    #reader {
      width: 100%;
      margin-top: 15px;
    }

    #result {
      margin-top: 15px;
      padding: 15px;
      border-radius: 10px;
      background: #eeeeee;
      text-align: center;
      line-height: 1.6;
      font-weight: bold;
    }

    .success {
      background: #d1e7dd !important;
      color: #0f5132;
    }

    .error {
      background: #f8d7da !important;
      color: #842029;
    }
  </style>
</head>

<body>

<div class="box">

  <h2>📦 BOX SCANNING</h2>

  <input
    id="scannedBy"
    type="text"
    placeholder="SCANNED BY - Apna naam"
    autocomplete="off"
  >

  <button class="start" onclick="startScanner()">
    📷 START CAMERA
  </button>

  <button class="stop" onclick="stopScanner()">
    🛑 STOP CAMERA
  </button>

  <div id="reader"></div>

  <div id="result">
    Naam enter karke camera start karo.
  </div>

</div>


<script>

let scanner = null;
let cameraRunning = false;

let lastScannedCode = "";
let lastScanTime = 0;

let audioContext = null;


// ========================================
// APPS SCRIPT URL
// ========================================

const APPS_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbxqdol2HuvTm6TC0VxiBUiPTE5jxVHY78Qi5Zd8oBWgGGypAs56kyJKarXPYAQmjvx_/exec";


// ========================================
// START CAMERA
// ========================================

function startScanner() {

  const scannedBy =
    document.getElementById("scannedBy").value.trim();

  if (!scannedBy) {

    showError(
      "❌ Pehle SCANNED BY me naam enter karo."
    );

    document.getElementById("scannedBy").focus();

    return;
  }

  if (cameraRunning) {
    return;
  }


  // Audio initialize
  initAudio();


  scanner = new Html5Qrcode("reader");


  const config = {

    fps: 20,

    qrbox: {
      width: 320,
      height: 160
    },

    formatsToSupport: [

      Html5QrcodeSupportedFormats.CODE_128,
      Html5QrcodeSupportedFormats.CODE_39,
      Html5QrcodeSupportedFormats.CODE_93,
      Html5QrcodeSupportedFormats.EAN_13,
      Html5QrcodeSupportedFormats.EAN_8,
      Html5QrcodeSupportedFormats.UPC_A,
      Html5QrcodeSupportedFormats.UPC_E,
      Html5QrcodeSupportedFormats.ITF_14,
      Html5QrcodeSupportedFormats.QR_CODE

    ]

  };


  scanner.start(

    { facingMode: "environment" },

    config,

    onScanSuccess,

    function(error) {}

  )

  .then(function() {

    cameraRunning = true;

    showMessage(
      "📷 CAMERA ON<br><br>Box barcode scan karo."
    );

  })

  .catch(function(error) {

    showError(
      "❌ Camera open nahi hua.<br><br>" +
      "Camera permission allow karo."
    );

    console.log(error);

  });

}


// ========================================
// BARCODE DETECTED
// ========================================

function onScanSuccess(decodedText) {

  const code =
    String(decodedText).trim().toUpperCase();


  if (!code) {
    return;
  }


  const now =
    Date.now();


  // Same barcode protection
  if (
    code === lastScannedCode &&
    now - lastScanTime < 1500
  ) {
    return;
  }


  lastScannedCode = code;
  lastScanTime = now;


  const scannedBy =
    document.getElementById("scannedBy").value.trim();


  if (!scannedBy) {

    wrongSound();

    showError(
      "❌ SCANNED BY me naam enter karo."
    );

    return;
  }


  // Immediately show scan
  showMessage(
    "📦 SCANNED<br><br>" +
    code
  );


  // Small vibration
  if (navigator.vibrate) {
    navigator.vibrate(60);
  }


  // ======================================
  // JSONP CALLBACK
  // ======================================

  const callbackName =
    "scanCallback_" +
    Date.now() +
    "_" +
    Math.floor(Math.random() * 10000);


  let scriptTag = null;


  window[callbackName] = function(response) {

    // Cleanup
    delete window[callbackName];


    if (
      scriptTag &&
      scriptTag.parentNode
    ) {

      scriptTag.parentNode.removeChild(
        scriptTag
      );

    }


    // ====================================
    // RIGHT / VALID
    // ====================================

    if (
      response &&
      response.success
    ) {

      // CLEAR RIGHT BEEP
      rightSound();


      showSuccess(

        "✅ RIGHT SCAN<br><br>" +

        "📦 " +
        response.containerCode +

        "<br>" +

        "🏪 " +
        response.marketplace +

        "<br>" +

        "📦 " +
        response.itemName +

        "<br>" +

        "🔢 Qty: " +
        response.qty +

        "<br>" +

        "🚚 " +
        response.vehicleNo

      );


      setTimeout(function() {

        showMessage(
          "📷 READY — Next box scan karo."
        );

      }, 250);


      return;
    }


    // ====================================
    // DUPLICATE / WRONG
    // ====================================

    if (
      response &&
      response.type === "duplicate"
    ) {

      wrongSound();


      if (navigator.vibrate) {

        navigator.vibrate(
          [180, 70, 180]
        );

      }


      showError(

        "⚠️ DUPLICATE SCAN ❌<br><br>" +
        response.message

      );


      setTimeout(function() {

        showMessage(
          "📷 READY — Next box scan karo."
        );

      }, 500);


      return;
    }


    // ====================================
    // INVALID / WRONG
    // ====================================

    if (
      response &&
      response.type === "invalid"
    ) {

      wrongSound();


      if (navigator.vibrate) {

        navigator.vibrate(
          [180, 70, 180]
        );

      }


      showError(

        "❌ INVALID CONTAINER<br><br>" +
        response.message

      );


      setTimeout(function() {

        showMessage(
          "📷 READY — Next box scan karo."
        );

      }, 500);


      return;
    }


    // ====================================
    // OTHER ERROR
    // ====================================

    wrongSound();


    showError(

      "❌ " +

      (
        response &&
        response.message
        ?
        response.message
        :
        "Scan failed."
      )

    );


    setTimeout(function() {

      showMessage(
        "📷 READY — Next box scan karo."
      );

    }, 500);

  };


  // ======================================
  // APPS SCRIPT REQUEST
  // ======================================

  const url =

    APPS_SCRIPT_URL +

    "?scan=1" +

    "&code=" +
    encodeURIComponent(code) +

    "&by=" +
    encodeURIComponent(scannedBy) +

    "&callback=" +
    encodeURIComponent(callbackName);


  scriptTag =
    document.createElement("script");


  scriptTag.src = url;


  scriptTag.onerror = function() {

    delete window[callbackName];


    if (
      scriptTag &&
      scriptTag.parentNode
    ) {

      scriptTag.parentNode.removeChild(
        scriptTag
      );

    }


    wrongSound();


    showError(
      "❌ Apps Script se connection nahi hua."
    );

  };


  document.body.appendChild(
    scriptTag
  );

}


// ========================================
// STOP CAMERA
// ========================================

function stopScanner() {

  if (
    !scanner ||
    !cameraRunning
  ) {

    return;
  }


  scanner.stop()

    .then(function() {

      scanner.clear();

      cameraRunning = false;

      lastScannedCode = "";
      lastScanTime = 0;


      showMessage(
        "🛑 Camera stopped."
      );

    })

    .catch(function(error) {

      console.log(error);

    });

}


// ========================================
// MESSAGE
// ========================================

function showMessage(message) {

  const box =
    document.getElementById("result");

  box.className = "";

  box.innerHTML = message;

}


// ========================================
// SUCCESS
// ========================================

function showSuccess(message) {

  const box =
    document.getElementById("result");

  box.className = "success";

  box.innerHTML = message;

}


// ========================================
// ERROR
// ========================================

function showError(message) {

  const box =
    document.getElementById("result");

  box.className = "error";

  box.innerHTML = message;

}


// ========================================
// INITIALIZE AUDIO
// ========================================

function initAudio() {

  try {

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;


    if (!AudioContext) {
      return;
    }


    if (!audioContext) {

      audioContext =
        new AudioContext();

    }


    if (
      audioContext.state ===
      "suspended"
    ) {

      audioContext.resume();

    }

  } catch (e) {

    console.log(e);

  }

}


// ========================================
// RIGHT SOUND
// CLEAR + NOTICEABLE
// ========================================

function rightSound() {

  try {

    initAudio();


    if (!audioContext) {
      return;
    }


    const now =
      audioContext.currentTime;


    const oscillator =
      audioContext.createOscillator();

    const gain =
      audioContext.createGain();


    oscillator.connect(gain);

    gain.connect(
      audioContext.destination
    );


    // Clear beep
    oscillator.type =
      "sine";


    oscillator.frequency.setValueAtTime(
      1100,
      now
    );


    // Louder than previous beep
    gain.gain.setValueAtTime(
      0.28,
      now
    );


    gain.gain.exponentialRampToValueAtTime(
      0.01,
      now + 0.16
    );


    oscillator.start(now);

    oscillator.stop(
      now + 0.16
    );

  } catch (e) {

    console.log(e);

  }

}


// ========================================
// WRONG SOUND
// LOUD DOUBLE BEEP
// ========================================

function wrongSound() {

  try {

    initAudio();


    if (!audioContext) {
      return;
    }


    const now =
      audioContext.currentTime;


    function makeTone(
      frequency,
      start
    ) {

      const oscillator =
        audioContext.createOscillator();

      const gain =
        audioContext.createGain();


      oscillator.connect(gain);

      gain.connect(
        audioContext.destination
      );


      oscillator.type =
        "square";


      oscillator.frequency.value =
        frequency;


      gain.gain.setValueAtTime(
        0.45,
        start
      );


      gain.gain.exponentialRampToValueAtTime(
        0.01,
        start + 0.16
      );


      oscillator.start(start);

      oscillator.stop(
        start + 0.16
      );

    }


    // First loud beep
    makeTone(
      300,
      now
    );


    // Second loud beep
    makeTone(
      220,
      now + 0.20
    );

  } catch (e) {

    console.log(e);

  }

}

</script>

</body>
</html>
