<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BOX CAMERA SCANNER</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      margin: 0;
      padding: 15px;
    }

    .box {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 18px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,.15);
    }

    h2 {
      text-align: center;
      margin-top: 5px;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      margin: 8px 0 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 17px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 10px;
      border: 0;
      border-radius: 9px;
      font-size: 18px;
      font-weight: bold;
    }

    .start {
      background: #198754;
      color: white;
    }

    .stop {
      background: #dc3545;
      color: white;
    }

    #reader {
      width: 100%;
      margin-top: 15px;
    }

    #result {
      margin-top: 15px;
      padding: 15px;
      border-radius: 10px;
      background: #eeeeee;
      text-align: center;
      line-height: 1.6;
      font-weight: bold;
    }

    .success {
      background: #d1e7dd !important;
      color: #0f5132;
    }

    .error {
      background: #f8d7da !important;
      color: #842029;
    }
  </style>
</head>

<body>

<div class="box">

  <h2>📦 BOX SCANNING</h2>

  <input
    id="scannedBy"
    type="text"
    placeholder="SCANNED BY - Apna naam"
    autocomplete="off"
  >

  <button class="start" onclick="startScanner()">
    📷 START CAMERA
  </button>

  <button class="stop" onclick="stopScanner()">
    🛑 STOP CAMERA
  </button>

  <div id="reader"></div>

  <div id="result">
    Naam enter karke camera start karo.
  </div>

</div>


<script>

let scanner = null;
let cameraRunning = false;
let processing = false;


// ========================================
// APPS SCRIPT URL
// ========================================

const APPS_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbxqdol2HuvTm6TC0VxiBUiPTE5jxVHY78Qi5Zd8oBWgGGypAs56kyJKarXPYAQmjvx_/exec";


// ========================================
// START CAMERA
// ========================================

function startScanner() {

  const scannedBy =
    document.getElementById("scannedBy").value.trim();

  if (!scannedBy) {

    showError("❌ Pehle SCANNED BY me naam enter karo.");

    document.getElementById("scannedBy").focus();

    return;
  }

  if (cameraRunning) {
    return;
  }

  processing = false;

  scanner = new Html5Qrcode("reader");

  const config = {

    fps: 15,

    qrbox: {
      width: 320,
      height: 160
    },

    formatsToSupport: [

      Html5QrcodeSupportedFormats.CODE_128,
      Html5QrcodeSupportedFormats.CODE_39,
      Html5QrcodeSupportedFormats.CODE_93,
      Html5QrcodeSupportedFormats.EAN_13,
      Html5QrcodeSupportedFormats.EAN_8,
      Html5QrcodeSupportedFormats.UPC_A,
      Html5QrcodeSupportedFormats.UPC_E,
      Html5QrcodeSupportedFormats.ITF_14,
      Html5QrcodeSupportedFormats.QR_CODE

    ]

  };


  scanner.start(

    { facingMode: "environment" },

    config,

    onScanSuccess,

    function(error) {}

  )

  .then(function() {

    cameraRunning = true;

    showMessage(
      "📷 CAMERA ON<br>Box barcode scan karo."
    );

  })

  .catch(function(error) {

    showError(
      "❌ Camera open nahi hua.<br><br>" +
      "Camera permission allow karo."
    );

    console.log(error);

  });

}


// ========================================
// BARCODE SUCCESS
// ========================================

function onScanSuccess(decodedText) {

  if (processing) {
    return;
  }

  processing = true;

  const code =
    String(decodedText).trim().toUpperCase();

  const scannedBy =
    document.getElementById("scannedBy").value.trim();


  if (!code) {

    processing = false;

    return;
  }


  // Beep
  beep();

  // Vibration
  if (navigator.vibrate) {
    navigator.vibrate(100);
  }


  showMessage(
    "📦 SCANNED<br><br>" +
    code +
    "<br><br>⏳ Sheet update ho rahi hai..."
  );


  // ======================================
  // JSONP CALLBACK
  // ======================================

  const callbackName =
    "scanCallback_" +
    Date.now() +
    "_" +
    Math.floor(Math.random() * 10000);


  window[callbackName] = function(response) {

    // Callback cleanup
    delete window[callbackName];

    if (scriptTag && scriptTag.parentNode) {
      scriptTag.parentNode.removeChild(scriptTag);
    }


    // ====================================
    // SUCCESS
    // ====================================

    if (response && response.success) {

      showSuccess(

        "✅ SCAN SUCCESSFUL<br><br>" +

        "📦 " + response.containerCode +
        "<br>" +

        "🏪 " + response.marketplace +
        "<br>" +

        "📦 " + response.itemName +
        "<br>" +

        "🔢 Qty: " + response.qty +
        "<br>" +

        "🚚 " + response.vehicleNo

      );


      // Ready for NEXT BOX
      setTimeout(function() {

        processing = false;

        showMessage(
          "📷 READY — Next box scan karo."
        );

      }, 700);

      return;
    }


    // ====================================
    // DUPLICATE
    // ====================================

    if (
      response &&
      response.type === "duplicate"
    ) {

      showError(
        "⚠️ DUPLICATE SCAN ❌<br><br>" +
        response.message
      );


      setTimeout(function() {

        processing = false;

        showMessage(
          "📷 READY — Next box scan karo."
        );

      }, 1200);

      return;
    }


    // ====================================
    // INVALID
    // ====================================

    if (
      response &&
      response.type === "invalid"
    ) {

      showError(
        "❌ INVALID CONTAINER<br><br>" +
        response.message
      );


      setTimeout(function() {

        processing = false;

        showMessage(
          "📷 READY — Next box scan karo."
        );

      }, 1200);

      return;
    }


    // ====================================
    // OTHER ERROR
    // ====================================

    showError(
      "❌ " +
      (
        response &&
        response.message
        ?
        response.message
        :
        "Scan failed."
      )
    );


    setTimeout(function() {

      processing = false;

      showMessage(
        "📷 READY — Next box scan karo."
      );

    }, 1200);

  };


  // ======================================
  // CREATE APPS SCRIPT REQUEST
  // ======================================

  const url =
    APPS_SCRIPT_URL +
    "?scan=1" +
    "&code=" +
    encodeURIComponent(code) +
    "&by=" +
    encodeURIComponent(scannedBy) +
    "&callback=" +
    encodeURIComponent(callbackName);


  const scriptTag =
    document.createElement("script");


  scriptTag.src = url;

  scriptTag.onerror = function() {

    delete window[callbackName];

    showError(
      "❌ Apps Script se connection nahi hua."
    );

    setTimeout(function() {

      processing = false;

      showMessage(
        "📷 READY — Next box scan karo."
      );

    }, 1500);

  };


  document.body.appendChild(scriptTag);

}


// ========================================
// STOP CAMERA
// ========================================

function stopScanner() {

  if (!scanner || !cameraRunning) {
    return;
  }


  scanner.stop()

    .then(function() {

      scanner.clear();

      cameraRunning = false;

      processing = false;

      showMessage(
        "🛑 Camera stopped."
      );

    })

    .catch(function(error) {

      console.log(error);

    });

}


// ========================================
// MESSAGE
// ========================================

function showMessage(message) {

  const box =
    document.getElementById("result");

  box.className = "";

  box.id = "result";

  box.innerHTML = message;

}


// ========================================
// SUCCESS
// ========================================

function showSuccess(message) {

  const box =
    document.getElementById("result");

  box.className = "success";

  box.innerHTML = message;

}


// ========================================
// ERROR
// ========================================

function showError(message) {

  const box =
    document.getElementById("result");

  box.className = "error";

  box.innerHTML = message;

}


// ========================================
// BEEP
// ========================================

function beep() {

  try {

    const audio =
      new (window.AudioContext ||
      window.webkitAudioContext)();

    const oscillator =
      audio.createOscillator();

    const gain =
      audio.createGain();

    oscillator.connect(gain);

    gain.connect(audio.destination);

    oscillator.frequency.value = 900;

    gain.gain.value = 0.15;

    oscillator.start();

    setTimeout(function() {

      oscillator.stop();

      audio.close();

    }, 120);

  } catch (e) {

    console.log(e);

  }

}

</script>

</body>
</html>
