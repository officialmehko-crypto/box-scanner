<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BOX CAMERA SCANNER</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      margin: 0;
      padding: 20px;
    }

    .box {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,.15);
    }

    h2 {
      text-align: center;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 17px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 12px;
      border: 0;
      border-radius: 9px;
      font-size: 18px;
      font-weight: bold;
    }

    .start {
      background: #198754;
      color: white;
    }

    .stop {
      background: #dc3545;
      color: white;
    }

    #reader {
      width: 100%;
      margin-top: 15px;
    }

    #result {
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      background: #eee;
      text-align: center;
      line-height: 1.6;
    }
  </style>
</head>

<body>

<div class="box">

  <h2>📦 BOX CAMERA SCANNER</h2>

  <input
    id="scannedBy"
    type="text"
    placeholder="SCANNED BY"
    autocomplete="off"
  >

  <div id="reader"></div>

  <button class="start" onclick="startScanner()">
    📷 OPEN CAMERA
  </button>

  <button class="stop" onclick="stopScanner()">
    🛑 STOP CAMERA
  </button>

  <div id="result">
    Ready for scanning...
  </div>

</div>

<script>

let scanner = null;
let running = false;
let alreadyScanned = false;


// ======================================
// YOUR APPS SCRIPT WEB APP
// ======================================

const APPS_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbxqdol2HuvTm6TC0VxiBUiPTE5jxVHY78Qi5Zd8oBWgGGypAs56kyJKarXPYAQmjvx_/exec";


// ======================================
// START CAMERA
// ======================================

function startScanner() {

  const scannedBy =
    document.getElementById("scannedBy").value.trim();

  if (!scannedBy) {

    document.getElementById("result").innerHTML =
      "❌ Pehle SCANNED BY name enter karo.";

    document.getElementById("scannedBy").focus();

    return;
  }

  if (running) return;

  alreadyScanned = false;

  scanner = new Html5Qrcode("reader");

  const config = {
    fps: 10,

    qrbox: {
      width: 300,
      height: 150
    },

    formatsToSupport: [
      Html5QrcodeSupportedFormats.CODE_128,
      Html5QrcodeSupportedFormats.CODE_39,
      Html5QrcodeSupportedFormats.CODE_93,
      Html5QrcodeSupportedFormats.EAN_13,
      Html5QrcodeSupportedFormats.EAN_8,
      Html5QrcodeSupportedFormats.UPC_A,
      Html5QrcodeSupportedFormats.UPC_E,
      Html5QrcodeSupportedFormats.ITF_14,
      Html5QrcodeSupportedFormats.QR_CODE
    ]
  };

  scanner.start(
    { facingMode: "environment" },
    config,
    onScanSuccess,
    function(error) {}
  )
  .then(function() {

    running = true;

    document.getElementById("result").innerHTML =
      "📷 CAMERA ON<br>Barcode scan karo.";

  })
  .catch(function(error) {

    document.getElementById("result").innerHTML =
      "❌ Camera open nahi hua.<br><br>" +
      "Camera permission allow karo.";

    console.log(error);

  });
}


// ======================================
// BARCODE SCANNED
// ======================================

function onScanSuccess(decodedText) {

  if (alreadyScanned) return;

  alreadyScanned = true;

  const code =
    String(decodedText).trim().toUpperCase();

  const scannedBy =
    document.getElementById("scannedBy").value.trim();

  document.getElementById("result").innerHTML =
    "✅ BARCODE SCANNED<br><br>" +
    code +
    "<br><br>⏳ Google Sheet me entry ho rahi hai...";

  stopScanner();

  // ====================================
  // SEND DIRECTLY TO APPS SCRIPT
  // ====================================

  const url =
    APPS_SCRIPT_URL +
    "?scan=1" +
    "&code=" + encodeURIComponent(code) +
    "&by=" + encodeURIComponent(scannedBy);

  setTimeout(function() {

    window.location.href = url;

  }, 500);
}


// ======================================
// STOP CAMERA
// ======================================

function stopScanner() {

  if (scanner && running) {

    scanner.stop()
      .then(function() {

        scanner.clear();
        running = false;

      })
      .catch(function(error) {

        console.log(error);

      });
  }
}

</script>

</body>
</html>
